name: Build Livreo APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extraire le projet Android
        run: |
          mkdir -p app-source
          unzip -q LivreoAndroid_MVP-1.zip -d app-source

      - name: Trouver Gradle
        run: |
          GRADLEW=$(find app-source -name gradlew -type f | head -n 1)
          if [ -z "$GRADLEW" ]; then
            echo "gradlew introuvable dans le ZIP"
            exit 1
          fi
          PROJECT_DIR=$(dirname "$GRADLEW")
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV

      - name: Rendre Gradle executable
        run: chmod +x "$PROJECT_DIR/gradlew"

      - name: Créer APK
        run: |
          cd "$PROJECT_DIR"
          ./gradlew assembleDebug --no-daemon

      - name: Récupérer APK
        uses: actions/upload-artifact@v4
        with:
          name: Livreo-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
