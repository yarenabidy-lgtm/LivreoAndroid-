
- name: Make Gradle executable
  working-directory: LivreoAndroid_MVP
  run: chmod +x gradlew

- name: Build APK
  working-directory: LivreoAndroid_MVP
  run: ./gradlew assembleDebug --no-daemon
jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Build APK
        run: ./gradlew assembleDebug --no-daemon
- name: Upload APK
  uses: actions/upload-artifact@v4
  with:
    name: Livreo-APK
    path: LivreoAndroid_MVP/app/build/outputs/apk/debug/app-debug.apk
